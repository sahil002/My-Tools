<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PRBSolver – Free Online Calculators, Converters &amp; Tools</title>
    <meta name="description" content="PRBSolver provides free, easy-to-use calculators, converters, text utilities, and practical online tools." />
    <meta name="author" content="PRBSolver" />
    <meta name="robots" content="index, follow" />
    <!-- Set the canonical from the requested route before the SPA mounts. -->
    <script>
      (function () {
        var base = 'https://www.prbsolver.com';
        var path = window.location.pathname.replace(/\\/+$/, '') || '/';
        var canonicalUrl = base + (path === '/' ? '/' : path);
        var link = document.querySelector('link[rel="canonical"]');
        if (!link) {
          link = document.createElement('link');
          link.setAttribute('rel', 'canonical');
          document.head.appendChild(link);
        }
        link.setAttribute('href', canonicalUrl);
      })();
    </script>
    
    <!-- OpenGraph Metadata -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Online Tools" />
    <meta property="og:title" content="Online Tools – Free Online Calculators, Converters &amp; Utilities" />
    <meta property="og:description" content="Free online calculators, converters, text utilities, and practical tools for everyday tasks." />
    <meta property="og:image" content="https://www.prbsolver.com/logo.png" />

    <link rel="alternate icon" type="image/png" href="/favicon.png" />

    </script>
